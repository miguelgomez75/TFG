text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="48.5278" x="143.3469" y="439.0571">Cancelar</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="711.5576"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="229.3848" x="525.1588" y="183.9326"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.3848" x="535.1588" y="205.0713">presenta lista de pacientes activos</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.1777" x="535.1588" y="219.04">• Nombre de cada paciente</text><rect fill="#F1F1F1" height="103.8125" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="260.0352" x="509.8336" y="305.8389"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.9355" x="519.8336" y="326.9775">presenta formulario de sesión</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.166" x="519.8336" y="340.9463">• Fecha (obligatorio)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.0352" x="519.8336" y="354.915">• Tipo: PRESENCIAL / CASA (obligatorio)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.1953" x="519.8336" y="368.8838">• Observaciones (opcional)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.2422" x="519.8336" y="382.8525">• Aciertos y errores (opcional)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.2656" x="519.8336" y="396.8213">• «Guardar» o «Cancelar»</text><polygon fill="#F1F1F1" points="362.8474,473.6514,522.0413,473.6514,534.0413,485.6514,522.0413,497.6514,362.8474,497.6514,350.8474,485