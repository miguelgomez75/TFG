<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="581px" preserveAspectRatio="none" style="width:891px;height:581px;background:#FFFFFF;" version="1.1" viewBox="0 0 891 581" width="891px" zoomAndPan="magnify"><title>verProgresoPaciente()</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="177.9326" x="355.3831" y="32.9951">verProgresoPaciente()</text></g><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="858.6987" x="15" y="50.042"/><ellipse cx="161.916" cy="85.9951" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="281.832" x="21" y="115.9951"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.832" x="31" y="137.1338">accede a PROGRESO_ABIERTO del paciente</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.3145" x="31" y="151.1025">(desde PACIENTE_ABIERTO o HOME)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="101.5977" x="111.1172" y="425.7139"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="81.5977" x="121.1172" y="446.8525">cierra la vista</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="569.6201"/><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="238.0039" x="440.8188" y="183.9326"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.9473" x="450.8188" y="205.0713">muestra datos del paciente</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.6094" x="450.8188" y="219.04">• Sesiones registradas</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.0039" x="450.8188" y="233.0088">• Actividades asignadas y su estado</text><polygon fill="#F1F1F1" points="494.1028,265.8389,625.5388,265.8389,637.5388,277.8389,625.5388,289.8389,494.1028,289.8389,482.1028,277.8389,494.1028,265.8389" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.436" x="494.1028" y="281.647">¿hay datos disponibles?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="8.7871" x="473.3157" y="275.2446">sí</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="637.5388" y="275.2446">no</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="206.4746" x="312.832" y="299.8389"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.3438" x="322.832" y="320.9775">presenta métricas de progreso</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.3887" x="322.832" y="334.9463">• Total de sesiones</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.4746" x="322.832" y="348.915">• Porcentaje medio de aciertos</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.5" x="322.832" y="362.8838">• Evolución temporal (gráfica)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="328.5313" x="539.3066" y="299.8389"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.8262" x="549.3066" y="320.9775">presenta mensaje informativo</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="308.5313" x="549.3066" y="334.9463">• «No hay sesiones ni actividades registradas aún»</text><polygon fill="#F1F1F1" points="559.8208,381.7139,571.8208,393.7139,559.8208,405.7139,547.8208,393.7139,559.8208,381.7139" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="198.248" x="460.6968" y="479.6826"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.6289" x="470.6968" y="500.8213">retorna al estado anterior</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.248" x="470.6968" y="514.79">(PACIENTE_ABIERTO o HOME)</text><ellipse cx="559.8208" cy="558.6201" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="559.8208" cy="558.6201" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="306.832" x2="306.832" y1="50.042" y2="569.6201"/><line style="stroke:#000000;stroke-width:1.5;" x1="871.8379" x2="871.8379" y1="50.042" y2="569.6201"/><line style="stroke:#181818;stroke-width:1;" x1="161.916" x2="161.916" y1="95.9951" y2="115.9951"/><polygon fill="#181818" points="157.916,105.9951,161.916,115.9951,165.916,105.9951,161.916,109.9951" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="482.1028" x2="416.0693" y1="277.8389" y2="277.8389"/><line style="stroke:#181818;stroke-width:1;" x1="416.0693" x2="416.0693" y1="277.8389" y2="299.8389"/><polygon fill="#181818" points="412.0693,289.8389,416.0693,299.8389,420.0693,289.8389,416.0693,293.8389" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="637.5388" x2="703.5723" y1="277.8389" y2="277.8389"/><line style="stroke:#181818;stroke-width:1;" 