<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="295px" preserveAspectRatio="none" style="width:993px;height:295px;background:#FFFFFF;" version="1.1" viewBox="0 0 993 295" width="993px" zoomAndPan="magnify"><defs/><g><!--cluster CdU-05 ? Registrar sesi?n--><g class="cluster" data-entity="CdU-05 . Registrar sesi.n" data-source-line="8" data-uid="ent0003" id="cluster_CdU-05 . Registrar sesi.n"><rect fill="none" height="85" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="216" x="119" y="95"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="200.8193" x="126.5903" y="109.9951">CdU-05 &#183; Registrar sesi&#243;n</text></g><!--entity RS--><g class="entity" data-entity="RS" data-source-line="9" data-uid="ent0004" id="entity_RS"><ellipse cx="226.6457" cy="146.9291" fill="#F1F1F1" rx="72.6457" ry="16.9291" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.9707" x="170.1603" y="151.5776">Registrar sesi&#243;n</text></g><!--entity Logopeda--><g class="entity" data-entity="Logopeda" data-source-line="6" data-uid="ent0002" id="entity_Logopeda"><ellipse cx="40.3916" cy="117.5" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M40.3916,125.5 L40.3916,152.5 M27.3916,133.5 L53.3916,133.5 M40.3916,152.5 L27.3916,167.5 M40.3916,152.5 L53.3916,167.5" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.7832" x="6" y="181.9951">Logopeda</text></g><g class="entity" data-entity="GMN6" data-source-line="14" data-uid="ent0007" id="entity_GMN6"><path d="M379,6 L379,143 L299.02,147 L379,151 L379,288.3906 A0,0 0 0 0 379,288.3906 L986.8027,288.3906 A0,0 0 0 0 986.8027,288.3906 L986.8027,16 L976.8027,6 L379,6 A0,0 0 0 0 379,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M976.8027,6 L976.8027,16 L986.8027,16 L976.8027,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.1724" x="385" y="23.0669">Actor principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.8701" x="502.3047" y="23.0669">Logopeda</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.5112" x="385" y="38.1997">Precondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.3721" x="393.2646" y="53.3325">P1. El logopeda est&#225; autenticado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.4736" x="393.2646" y="68.4653">P2. El paciente existe y est&#225; activo.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="385" y="83.5981">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8271" x="385" y="98.731">Flujo principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.5747" x="393.2646" y="113.8638">1. El logopeda accede al estado SEGUIMIENTO_ABIERTO del paciente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.8325" x="393.2646" y="128.9966">2. El logopeda pulsa "Registrar sesi&#243;n".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="484.0786" x="393.2646" y="144.1294">3. El sistema muestra el formulario de sesi&#243;n (fecha, tipo, observaciones).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5044" x="393.2646" y="159.2622">4. El logopeda introduce los datos y guarda.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="518.0894" x="393.2646" y="174.395">5. El sistema crea la Sesion vinculada al paciente con tipo PRESENCIAL o CASA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="385" y="189.5278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.1665" x="385" y="204.6606">Postcondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.709" x="393.2646" y="219.7935">Q1. La Sesion queda almacenada en el historial del paciente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="385" y="234.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.9526" x="385" y="250.0591">Flujos alternativos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="578.5381" x="393.2646" y="265.1919">FA-1 (paso 4): Datos obligatorios incompletos &#8594; el sistema muestra errores y no guarda.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="552.2905" x="393.2646" y="280.3247">FA-2 (paso 4): El logopeda cancela &#8594; no se crea ninguna sesi&#243;n. Fin del caso de uso.</text></g><!--link Logopeda to RS--><g class="link" data-entity-1="Logopeda" data-entity-2="RS" data-source-line="10" data-uid="lnk5" id="link_Logopeda_RS"><path d="M75.25,147 C97.24,147 120.78,147 147.85,147" fill="none" id="Logopeda-to-RS" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="153.85,147,144.85,143,148.85,147,144.85,151,153.85,147" sty