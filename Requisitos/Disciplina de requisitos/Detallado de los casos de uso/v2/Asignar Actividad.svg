<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="355px" preserveAspectRatio="none" style="width:1010px;height:355px;background:#FFFFFF;" version="1.1" viewBox="0 0 1010 355" width="1010px" zoomAndPan="magnify"><defs/><g><!--cluster CdU-01 ? Asignar actividad--><g class="cluster" data-entity="CdU-01 . Asignar actividad" data-source-line="8" data-uid="ent0003" id="cluster_CdU-01 . Asignar actividad"><rect fill="none" height="87" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="225" x="119" y="124.5"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="209.8564" x="126.5718" y="139.4951">CdU-01 &#183; Asignar actividad</text></g><!--entity AA--><g class="entity" data-entity="AA" data-source-line="9" data-uid="ent0004" id="entity_AA"><ellipse cx="231.1422" cy="177.6284" fill="#F1F1F1" rx="76.1422" ry="17.6284" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.4883" x="170.398" y="182.2769">Asignar actividad</text></g><!--entity Logopeda--><g class="entity" data-entity="Logopeda" data-source-line="6" data-uid="ent0002" id="entity_Logopeda"><ellipse cx="40.3916" cy="148" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M40.3916,156 L40.3916,183 M27.3916,164 L53.3916,164 M40.3916,183 L27.3916,198 M40.3916,183 L53.3916,198" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.7832" x="6" y="212.4951">Logopeda</text></g><g class="entity" data-entity="GMN6" data-source-line="14" data-uid="ent0007" id="entity_GMN6"><path d="M388,6 L388,173.5 L307.08,177.5 L388,181.5 L388,348.9219 A0,0 0 0 0 388,348.9219 L1003.4326,348.9219 A0,0 0 0 0 1003.4326,348.9219 L1003.4326,16 L993.4326,6 L388,6 A0,0 0 0 0 388,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M993.4326,6 L993.4326,16 L1003.4326,16 L993.4326,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.1724" x="394" y="23.0669">Actor principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.8701" x="511.3047" y="23.0669">Logopeda</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.5112" x="394" y="38.1997">Precondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.3721" x="402.2646" y="53.3325">P1. El logopeda est&#225; autenticado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.02" x="402.2646" y="68.4653">P2. Existe al menos un paciente activo.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.4482" x="402.2646" y="83.5981">P3. Existe al menos una actividad en estado DISPONIBLE.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="394" y="98.731">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8271" x="394" y="113.8638">Flujo principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.4976" x="402.2646" y="128.9966">1. El logopeda selecciona un paciente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.4395" x="402.2646" y="144.1294">2. El logopeda selecciona una actividad disponible.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.7378" x="402.2646" y="159.2622">3. El sistema muestra el formulario de par&#225;metros.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.1045" x="402.2646" y="174.395">4. El logopeda confirma la asignaci&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="417.5425" x="402.2646" y="189.5278">5. El sistema crea la AsignacionActividad en estado PENDIENTE.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.7949" x="402.2646" y="204.6606">6. El sistema notifica a la familia.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="394" y="219.7935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.1665" x="394" y="234.9263">Postcondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.2944" x="402.2646" y="250.0591">Q1. Existe una AsignacionActividad vinculando paciente y actividad.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.0356" x="402.2646" y="265.1919">Q2. El estado de progreso es PENDIENTE.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="394" y="280.3247">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.9526" x="394" y="295.4575">Flujos alternativos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="554.7725" x="402.2646" y="310.5903">FA-1 (paso 1): Paciente no activo &#8594; el sistema muestra aviso y no permite continuar.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="586.168" x="402.2646" y="325.7231">FA-2 (paso 2): La actividad no est&#225; DISPONIBLE &#8594; el sistema filtra la lista y no la muestra.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="580.7026" x="402.2646" y="340.856">FA-3 (paso 4): El logopeda cancela &#8594; no se crea ninguna asignaci&#243;n. Fin del caso de uso.</text></g><!--link Logopeda to AA--><g class="link" data-entity-1="Logopeda" data-entity-2="AA" data-source-line="10" data-uid="lnk5" id="link_Logopeda_AA"><path d="M75.2,177.5 C97.33,177.5 121.19,177.5 148.78,177.5" fill="none" id="Logopeda-to-AA" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="154.78,177.5,145.78,173.5,149.78,177.5,145.78,181.5,154.78,177.5" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[rLFDRjD04BxxAKQzj8sKY2I5Gmz8XYPIf2Yu0XvWiDTcq7hMsbr7L8WhPuJ40_GPEFHEtgHFmgpjE3-Dk5VoQVQRx_lcc_4vFFx- -Uo-w1pUPX-7ByO0iQE2qGAcdjQKOIPlptAaIAlSWpTWgVZi8IEhP2J3aKncB2nDOIgLOHI5EdAX5Pnr8VnzU1h36NoB02wUr2y17SInl6qPOJXy7IhVeuYDLvs-oLlKO10t-fKbJgb2VJqOxCo4zqGC6Sue5RFAoRDK0PBn26OQz5P4ER-v1wozOayfPcRKmYO2-qfET553gTWug1agJ4c0glMznKvFON4t6oWEEa8EDultoRlLuiroDeeQbtDTVp47KpISHowTqYeDW-2-YrP-yX_elecCN6MOFkckRzhqkU2xH2XhSMWb3msviMMjqPA1J8cOtToNoblZshwhGpt9E2Sh35h4cgscjFd3BVRbWKPgLGEBEvZX-4H4oMnrivYjFinQYbS75789bCkUe27AiIHDs4MP6ETFRFnstAyd179AV2tfoyGiwls6xtRHjKPksw0xbo4PQmghd97IlkdTMftSWrUMCTnAxsSU3yTmKQ4qZY-l8TaAikck2Xv__0fxE5uDhabwxWAmKhOawP5nFN6DThIbddJK4w5Uxg-VJNVhknCy5if91nq9Lai5ModT6-Wrfft6bMWSd09ogWGVQANJgNRZJ5mqfxXt7J0dbWorzBWcpDh9twGu-FJg7m00]--></g></svg>
