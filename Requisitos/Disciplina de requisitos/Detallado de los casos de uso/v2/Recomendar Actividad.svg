<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="340px" preserveAspectRatio="none" style="width:1135px;height:340px;background:#FFFFFF;" version="1.1" viewBox="0 0 1135 340" width="1135px" zoomAndPan="magnify"><defs/><g><!--cluster CdU-04 ? Recomendar actividad--><g class="cluster" data-entity="CdU-04 . Recomendar actividad" data-source-line="8" data-uid="ent0003" id="cluster_CdU-04 . Recomendar actividad"><rect fill="none" height="93" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="264" x="119" y="114"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="248.165" x="126.9175" y="128.9951">CdU-04 &#183; Recomendar actividad</text></g><!--entity RE--><g class="entity" data-entity="RE" data-source-line="9" data-uid="ent0004" id="entity_RE"><ellipse cx="250.7015" cy="170.2403" fill="#F1F1F1" rx="91.7015" ry="20.7403" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.582" x="171.9104" y="174.8887">Recomendar actividad</text></g><!--entity Logopeda--><g class="entity" data-entity="Logopeda" data-source-line="6" data-uid="ent0002" id="entity_Logopeda"><ellipse cx="40.3916" cy="140.5" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M40.3916,148.5 L40.3916,175.5 M27.3916,156.5 L53.3916,156.5 M40.3916,175.5 L27.3916,190.5 M40.3916,175.5 L53.3916,190.5" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.7832" x="6" y="204.9951">Logopeda</text></g><g class="entity" data-entity="GMN6" data-source-line="14" data-uid="ent0007" id="entity_GMN6"><path d="M427,6 L427,166 L342.14,170 L427,174 L427,333.7891 A0,0 0 0 0 427,333.7891 L1128.5513,333.7891 A0,0 0 0 0 1128.5513,333.7891 L1128.5513,16 L1118.5513,6 L427,6 A0,0 0 0 0 427,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1118.5513,6 L1118.5513,16 L1128.5513,16 L1118.5513,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.1724" x="433" y="23.0669">Actor principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.8701" x="550.3047" y="23.0669">Logopeda</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.5112" x="433" y="38.1997">Precondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.3721" x="441.2646" y="53.3325">P1. El logopeda est&#225; autenticado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.3188" x="441.2646" y="68.4653">P2. La actividad existe y est&#225; en estado DISPONIBLE.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.2979" x="441.2646" y="83.5981">P3. El paciente tiene acceso activo al sistema.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="433" y="98.731">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8271" x="433" y="113.8638">Flujo principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.6289" x="441.2646" y="128.9966">1. El logopeda selecciona el paciente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.0239" x="441.2646" y="144.1294">2. El logopeda selecciona la actividad a recomendar.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.8794" x="441.2646" y="159.2622">3. El logopeda a&#241;ade instrucciones opcionales para la familia.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.376" x="441.2646" y="174.395">4. El logopeda guarda la recomendaci&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="512.9478" x="441.2646" y="189.5278">5. El sistema crea un Registro de tipo RECOMENDACION vinculado al paciente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="555.5215" x="441.2646" y="204.6606">6. La actividad queda visible en la secci&#243;n "Actividades recomendadas" de la familia.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="433" y="219.7935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.1665" x="433" y="234.9263">Postcondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.9839" x="441.2646" y="250.0591">Q1. Existe un Registro de tipo RECOMENDACION para el paciente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.9209" x="441.2646" y="265.1919">Q2. La actividad es visible para la familia en su listado de recomendadas.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="433" y="280.3247">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.9526" x="433" y="295.4575">Flujos alternativos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="672.2866" x="441.2646" y="310.5903">FA-1 (paso 2): La actividad est&#225; ARCHIVADA &#8594; el sistema no la muestra en la lista. Fin del caso de uso.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="659.0391" x="441.2646" y="325.7231">FA-2 (paso 3): El paciente no tiene acceso activo &#8594; el sistema avisa al logopeda. Fin del caso de uso.</text></g><!--link Logopeda to RE--><g class="link" data-entity-1="Logopeda" data-entity-2="RE" data-source-line="10" data-uid="lnk5" id="link_Logopeda_RE"><path d="M75.38,170 C98.06,170 123.06,170 152.63,170" fill="none" id="Logopeda-to-RE" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="158.63,170,149.63,166,153.63,170,149.63,174,158.63,170" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[rLJBRXCn5DtFLrnbqpPI8feK5bqW3Nc8I259Ws1_iPrWvDY3xOb0Y2rhL8aFu1CG2_RaJ_ebNDkJrpGLwqeZpSY-FkVSSu_d3Ev-V7zqJtO6FVwczUGAO2wOMGdDqG8oBzUI8wVjHzbLfiJ2WpTWvVAz1owje9QCpgWpOs5ibgOG7BCihADUAW6DoeU_VquwqO0l6S3vgQqBG0Vp0MrlSQ7LUXvMlcQPDbvKAimYLJMRULHHMAcPB51TDvjxIM5_HhACvfAHPE5ecrO1PfTj62XGMnBX_EOdOEc5zf8XD-rKrcd36FVoG7oIZaHyhWu87Jwe7FgZrxFfPFHYFAXETYD1WKmIf01FBq50J3YJyEYbm0Mu5RQpg7MeoW_cg9U8LTFgX18ij4Eozmo9jlDWgJfi0y7kp4y7kyS7SVCBkG2fdRSbIzw1AIAKeiy2ROHSu4egYGdZwXXZMQBbiMf7nkJcjqx5JsDnrJymAn1AJN5Pqeerm8DbXQ4fzwQl1fD-tXjD9x0cPqeL_CPwvyzga_fO1WrhwUGxIYGDIWKxM5G0ZNnRHxtir75qZK1ys5VAa77-H8Xkmc1I8FulFJfsRrutzmBcTffh7eSUN0bAfi0How7mmmGvSiSBgp6aRATscBSkuRn0ob_duhhE6jASptilHs_pVWvttsw3rkrqj0awLYMLMQoyZ3hQC9IQf2XW0PSqbQwwEaJNgUYwH7Tu5mZkr7MeaIBvW67Esq0zG4O6GFWp_0C0]--></g></svg>
