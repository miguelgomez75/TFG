<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAA — Acceso</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #f0f4ff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    }
    h1 { font-size: 1.8rem; font-weight: 800; color: #1a1a2e; margin-bottom: 8px; }
    p  { color: #666; margin-bottom: 32px; font-size: 0.95rem; }
    label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 0.9rem; }
    input {
      width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
      border-radius: 10px; font-size: 1rem; font-family: inherit;
      margin-bottom: 20px; transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #4361ee; }
    button {
      width: 100%; padding: 14px; background: #4361ee; color: white;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: background .2s;
    }
    button:hover { background: #3451d1; }
    .error { color: #e63946; font-size: 0.9rem; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sistema CAA</h1>
    <p>Comunicación Aumentativa y Alternativa</p>
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="correo@ejemplo.com">
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">
    <button onclick="login()">Entrar</button>
    <div class="error" id="error">Credenciales incorrectas</div>
  </div>
  <script>
    async function login() {
      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('error').style.display = 'block';
        return;
      }
      localStorage.setItem('token', data.token);
      localStorage.setItem('rol',   data.rol);
      if (data.rol === 'LOGOPEDA') window.location.href = '/logopeda/dashboard.html';
      else window.location.href = '/familia/dashboard.html';
    }
  </script>
</body>
</html>
