alidación</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.3047" x="467.7266" y="542.7588">• Indica campos pendientes</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.3945" x="467.7266" y="556.7275">• No guarda ninguna Sesion</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="172.6543" x="471.6484" y="604.5576"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.6543" x="481.6484" y="625.6963">permanece en formulario</text><ellipse cx="557.9756" cy="678.5576" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="557.9756" cy="678.5576" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="190.6309" x="741.9426" y="473.6514"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.0195" x="751.9426" y="494.79">descarta la operación</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.6309" x="751.9426" y="508.7588">• No se crea ninguna Sesion</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="204.2715" x="735.1223" y="556.5889"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.2715" x="745.1223" y="577.7275">retorna a SESIONES_ABIERTAS</text><ellipse cx="837.2581" cy="636.5576" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="837.2581" cy="636.5576" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="210.0996" x2="210.0996" y1="50.042" y2="711.5576"/><line style="stroke:#000000;stroke-width:1.5;" x1