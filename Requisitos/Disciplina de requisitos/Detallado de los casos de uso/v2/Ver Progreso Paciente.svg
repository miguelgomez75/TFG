<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="265px" preserveAspectRatio="none" style="width:1067px;height:265px;background:#FFFFFF;" version="1.1" viewBox="0 0 1067 265" width="1067px" zoomAndPan="magnify"><defs/><g><!--cluster CdU-06 ? Ver progreso paciente--><g class="cluster" data-entity="CdU-06 . Ver progreso paciente" data-source-line="9" data-uid="ent0004" id="cluster_CdU-06 . Ver progreso paciente"><rect fill="none" height="93" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="264" x="119" y="76"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="248.1377" x="126.9312" y="90.9951">CdU-06 &#183; Ver progreso paciente</text></g><!--entity VP--><g class="entity" data-entity="VP" data-source-line="10" data-uid="ent0005" id="entity_VP"><ellipse cx="250.9161" cy="132.0832" fill="#F1F1F1" rx="90.9161" ry="20.5832" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.8115" x="173.0103" y="136.7316">Ver progreso paciente</text></g><!--entity Logopeda--><g class="entity" data-entity="Logopeda" data-source-line="6" data-uid="ent0002" id="entity_Logopeda"><ellipse cx="40.3916" cy="46.5" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M40.3916,54.5 L40.3916,81.5 M27.3916,62.5 L53.3916,62.5 M40.3916,81.5 L27.3916,96.5 M40.3916,81.5 L53.3916,96.5" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.7832" x="6" y="110.9951">Logopeda</text></g><!--entity Familia--><g class="entity" data-entity="Familia" data-source-line="7" data-uid="ent0003" id="entity_Familia"><ellipse cx="40.2588" cy="157.5" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M40.2588,165.5 L40.2588,192.5 M27.2588,173.5 L53.2588,173.5 M40.2588,192.5 L27.2588,207.5 M40.2588,192.5 L53.2588,207.5" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.5176" x="15" y="221.9951">Familia</text></g><g class="entity" data-entity="GMN8" data-source-line="16" data-uid="ent0009" id="entity_GMN8"><path d="M427,6 L427,128 L342.06,132 L427,136 L427,258.125 A0,0 0 0 0 427,258.125 L1060.5488,258.125 A0,0 0 0 0 1060.5488,258.125 L1060.5488,16 L1050.5488,6 L427,6 A0,0 0 0 0 427,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1050.5488,6 L1050.5488,16 L1060.5488,16 L1050.5488,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="61.0771" x="433" y="23.0669">Actores:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8696" x="498.2095" y="23.0669">Logopeda (primario), Familia (secundario)</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.5112" x="433" y="38.1997">Precondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.6421" x="441.2646" y="53.3325">P1. El actor est&#225; autenticado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="550.1577" x="441.2646" y="68.4653">P2. El paciente existe y tiene al menos una Sesion o AsignacionActividad registrada.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="433" y="83.5981">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8271" x="433" y="98.731">Flujo principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.7031" x="441.2646" y="113.8638">1. El actor accede al estado PROGRESO_ABIERTO del paciente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="525.0781" x="441.2646" y="128.9966">2. El sistema carga las m&#233;tricas: sesiones, aciertos, errores, evoluci&#243;n temporal.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.9048" x="441.2646" y="144.1294">3. El sistema muestra gr&#225;ficas y estad&#237;sticas de progreso.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="433" y="159.2622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.1665" x="433" y="174.395">Postcondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.915" x="441.2646" y="189.5278">Q1. Los datos de progreso se muestran correctamente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="433" y="204.6606">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.9526" x="433" y="219.7935">Flujos alternativos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="604.2842" x="441.2646" y="234.9263">FA-1 (paso 2): No hay datos disponibles &#8594; el sistema muestra un mensaje informativo vac&#237;o.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="592.687" x="441.2646" y="250.0591">FA-2 (paso 2): Paciente no encontrado &#8594; el sistema muestra error 404 y redirige al listado.</text></g><!--link Logopeda to VP--><g class="link" data-entity-1="Logopeda" data-entity-2="VP" data-source-line="11" data-uid="lnk6" id="link_Logopeda_VP"><path d="M75.46,85.12 C106.85,93.55 148.3551,104.7045 185.7951,114.7545" fill="none" id="Logopeda-to-VP" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="191.59,116.31,183.9347,110.1135,186.761,115.0137,181.8607,117.84,191.59,116.31" style="stroke:#181818;stroke-width:1;"/></g><!--link Familia to VP--><g class="link" data-entity-1="Familia" data-entity-2="VP" data-source-line="12" data-uid="lnk7" id="link_Familia_VP"><path d="M66.24,180.47 C96.76,172.42 143.8886,159.9909 185.1186,149.1109" fill="none" id="Familia-to-VP" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="190.92,147.58,181.1973,146.0088,186.0855,148.8558,183.2385,153.744,190.92,147.58" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[rLDDJnH14BtFhtZX0cpO3I3nmC5aDM1CYAoWN4tPNJiqcUcQTFSGYV7gsPZm0pXwuEJ1k_jF-2NMzEpm4V47a4motTLThzvxLRsAcyllJ-uhLl7AVXXlFWTEEA09KWQEWeQCOvzOpv-ahABYUK8I15UU9bWNs2GdlY2J9E10IcdOqdAxJxMh71L5TujyMJ5MbhRy-VsuCIluKW1hZvwjWo9EPde-rC5u_AAFB4iDWQz5uINnagRC-qkZqRJZnN5tDBh3M6k2goauMT-uXLcBR5flSpGdpbI2UEkCYitv6WLcMnFiLUZLSaoBAr2RbAipP6NItzdETmOHuCykwky2IVSCgb2pbuZM4uuvAZu4q-XAJrqnPUpEdIMBmALc1h8qAJAd_QezKtU2yyOrL0saxdCYOzZc8ifEAM5sTFZwQE_uyEFqvPkze_U7i7p7hIVSyuqTovfWA9I4Ifsl5pzJK65n5p7pvBY1BZCaqHM7q5chYtEfMkCMlpmKeP50LG_yx05mtNAd1cLONCqxMBKaarnSnvJtIdoOWQNYcSJqI1lUgUG3jT1IaWTfIdIeus4av3ciUwbt5aRr9t7mf4xBBUZ-TBobiq6Aihs-YxU2KxeOIhZOY7UVAewu-VO3_A-irdTzZNJ6S7ukeSxeE2Upk5vEXbROlbTXDao85x1NcLslvN_usMxiREweRO7r8ReozxbokT6JWhr5zmR-0W00]--></g></svg>
