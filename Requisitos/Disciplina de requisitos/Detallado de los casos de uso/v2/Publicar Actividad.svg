<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="295px" preserveAspectRatio="none" style="width:1190px;height:295px;background:#FFFFFF;" version="1.1" viewBox="0 0 1190 295" width="1190px" zoomAndPan="magnify"><defs/><g><!--cluster CdU-02 ? Publicar actividad--><g class="cluster" data-entity="CdU-02 . Publicar actividad" data-source-line="8" data-uid="ent0003" id="cluster_CdU-02 . Publicar actividad"><rect fill="none" height="87" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="230" x="119" y="94"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="214.0469" x="126.9766" y="108.9951">CdU-02 &#183; Publicar actividad</text></g><!--entity PA--><g class="entity" data-entity="PA" data-source-line="9" data-uid="ent0004" id="entity_PA"><ellipse cx="233.4588" cy="146.8918" fill="#F1F1F1" rx="77.4588" ry="17.8918" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.6465" x="171.1356" y="151.5402">Publicar actividad</text></g><!--entity Logopeda--><g class="entity" data-entity="Logopeda" data-source-line="6" data-uid="ent0002" id="entity_Logopeda"><ellipse cx="40.3916" cy="117.5" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M40.3916,125.5 L40.3916,152.5 M27.3916,133.5 L53.3916,133.5 M40.3916,152.5 L27.3916,167.5 M40.3916,152.5 L53.3916,167.5" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.7832" x="6" y="181.9951">Logopeda</text></g><g class="entity" data-entity="GMN6" data-source-line="14" data-uid="ent0007" id="entity_GMN6"><path d="M393,6 L393,143 L311.03,147 L393,151 L393,288.3906 A0,0 0 0 0 393,288.3906 L1183.0122,288.3906 A0,0 0 0 0 1183.0122,288.3906 L1183.0122,16 L1173.0122,6 L393,6 A0,0 0 0 0 393,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1173.0122,6 L1173.0122,16 L1183.0122,16 L1173.0122,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.1724" x="399" y="23.0669">Actor principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.8701" x="516.3047" y="23.0669">Logopeda</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.5112" x="399" y="38.1997">Precondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.3721" x="407.2646" y="53.3325">P1. El logopeda est&#225; autenticado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.27" x="407.2646" y="68.4653">P2. La actividad seleccionada est&#225; en estado BORRADOR.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="399" y="83.5981">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8271" x="399" y="98.731">Flujo principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.5947" x="407.2646" y="113.8638">1. El logopeda accede al detalle de la actividad en BORRADOR.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.1738" x="407.2646" y="128.9966">2. El logopeda revisa t&#237;tulo, descripci&#243;n y contenido.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.9438" x="407.2646" y="144.1294">3. El logopeda pulsa "Publicar".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.2188" x="407.2646" y="159.2622">4. El sistema valida que todos los campos obligatorios est&#233;n completos.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.3188" x="407.2646" y="174.395">5. El sistema cambia el estado de la actividad a DISPONIBLE.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="399" y="189.5278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.1665" x="399" y="204.6606">Postcondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.5503" x="407.2646" y="219.7935">Q1. La actividad est&#225; en estado DISPONIBLE y es visible para asignaci&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="399" y="234.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.9526" x="399" y="250.0591">Flujos alternativos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="760.7476" x="407.2646" y="265.1919">FA-1 (paso 4): La actividad tiene campos incompletos &#8594; el sistema muestra los errores y permanece en BORRADOR.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.0522" x="407.2646" y="280.3247">FA-2 (paso 3): El logopeda cancela &#8594; el estado no cambia. Fin del caso de uso.</text></g><!--link Logopeda to PA--><g class="link" data-entity-1="Logopeda" data-entity-2="PA" data-source-line="10" data-uid="lnk5" id="link_Logopeda_PA"><path d="M75.21,147 C97.59,147 121.91,147 149.96,147" fill="none" id="Logopeda-to-PA" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="155.96,147,146.96,143,150.96,147,146.96,151,155.96,147" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[rLDDRjD05Dxx54_Pj8r8HDAowG8ffOrKAI8cY0EypBo6GPCPCpEEL26sh14I1s39eYiMxCbDUX8-EtRpqrwWKYHdVjxtQn_H_S_lp-wN7T4R_Q7tSaYKbtDh50TYbSpAQDOuV9QUCYitYPAdO1OV4saJ19Qyo-3C1vhuXIz4SvPL- -mMLgZJfF3lxnCvTEXBHdJy-E24E58-mc6BIRtUwshdQvOvdwHHu6ysjxhTKQsW2COfKx0zxtQtSghp79AyqqP1haGSOnVL3FfqPScs91BJ-XTncSGbADA-lxasxDE4j_8eYXLLGV73aBZg3qReOZgRZIwditvMCuzj-SdlAQin3vXPAT52R4bBOelaiBAxd23O8bS8mts482iJcTBwBfNMly1yLC4Kogp_EBebk8ShqrewtHykIelPJjj4PtFfhBuKJKooP5gnXH3wN0fU0UqZfYCfNXPuUCmj61KOBAf0VZimBWihoSSDsAizCCpD3RApRMg7Tfakhz_dqxVN5vEh9idSn_H4YUy61-qS5h85GWuI2JcPEH8kE60iceNZEgNTmYAgI18S0zG_K8r7lG4T5nmzdPsSxxCc8qxQF51swvxkl_seVBREboLaWRXAJqBm0OfkgP2mP2TA7lSCqc53UWhItTeKEoM8hQ5e_3hVnDkdiN58rc8TwuZBYFx5QQe-ely0]--></g></svg>
