<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="386px" preserveAspectRatio="none" style="width:1185px;height:386px;background:#FFFFFF;" version="1.1" viewBox="0 0 1185 386" width="1185px" zoomAndPan="magnify"><defs/><g><!--cluster CdU-03 ? Realizar actividad--><g class="cluster" data-entity="CdU-03 . Realizar actividad" data-source-line="8" data-uid="ent0003" id="cluster_CdU-03 . Realizar actividad"><rect fill="none" height="87" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="229" x="101" y="139.5"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="213.3701" x="108.8149" y="154.4951">CdU-03 &#183; Realizar actividad</text></g><!--entity RA--><g class="entity" data-entity="RA" data-source-line="9" data-uid="ent0004" id="entity_RA"><ellipse cx="215.6134" cy="192.4227" fill="#F1F1F1" rx="77.6134" ry="17.9227" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.0156" x="153.1055" y="197.0711">Realizar actividad</text></g><!--entity Familia--><g class="entity" data-entity="Familia" data-source-line="6" data-uid="ent0002" id="entity_Familia"><ellipse cx="31.2588" cy="163" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M31.2588,171 L31.2588,198 M18.2588,179 L44.2588,179 M31.2588,198 L18.2588,213 M31.2588,198 L44.2588,213" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.5176" x="6" y="227.4951">Familia</text></g><g class="entity" data-entity="GMN6" data-source-line="14" data-uid="ent0007" id="entity_GMN6"><path d="M374,6 L374,188.5 L293.05,192.5 L374,196.5 L374,379.1875 A0,0 0 0 0 374,379.1875 L1178.542,379.1875 A0,0 0 0 0 1178.542,379.1875 L1178.542,16 L1168.542,6 L374,6 A0,0 0 0 0 374,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1168.542,6 L1168.542,16 L1178.542,16 L1168.542,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.1724" x="380" y="23.0669">Actor principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.9092" x="497.3047" y="23.0669">Familia</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.5112" x="380" y="38.1997">Precondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.5371" x="388.2646" y="53.3325">P1. La familia est&#225; autenticada.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="487.6396" x="388.2646" y="68.4653">P2. Existe una AsignacionActividad en estado PENDIENTE o EN_PROGRESO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.6025" x="404.7939" y="83.5981">para el paciente asociado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="380" y="98.731">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8271" x="380" y="113.8638">Flujo principal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.1514" x="388.2646" y="128.9966">1. La familia selecciona la actividad en ACTIVIDAD_ABIERTA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.8389" x="388.2646" y="144.1294">2. La familia pulsa "Iniciar".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.1499" x="388.2646" y="159.2622">3. El sistema crea una Sesion en estado EnCurso.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.7515" x="388.2646" y="174.395">4. El sistema muestra los ejercicios uno a uno.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.8003" x="388.2646" y="189.5278">5. La familia responde cada ejercicio; el sistema registra aciertos/errores.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="515.3599" x="388.2646" y="204.6606">6. Al responder el &#250;ltimo ejercicio, el sistema marca la Sesion como Finalizada.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="505.0449" x="388.2646" y="219.7935">7. El sistema actualiza el progreso de la AsignacionActividad a COMPLETADA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.6279" x="388.2646" y="234.9263">8. El sistema muestra la pantalla RESULTADO_ACTIVIDAD.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="380" y="250.0591">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.1665" x="380" y="265.1919">Postcondiciones:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.0669" x="388.2646" y="280.3247">Q1. Existe una Sesion Finalizada con los resultados registrados.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.7622" x="388.2646" y="295.4575">Q2. El progreso de la AsignacionActividad es COMPLETADA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="380" y="310.5903">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.9526" x="380" y="325.7231">Flujos alternativos:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="652.3359" x="388.2646" y="340.856">FA-1 (paso 5): La familia interrumpe &#8594; la Sesion pasa a Pausada; el progreso queda EN_PROGRESO.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="775.2773" x="388.2646" y="355.9888">FA-2 (FA-1, timeout): Sin retomar en el tiempo l&#237;mite &#8594; la Sesion pasa a Abandonada; se guardan resultados parciales.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="735.9092" x="388.2646" y="371.1216">FA-3 (paso 4): P&#233;rdida de conexi&#243;n &#8594; el sistema guarda el estado actual; la familia puede retomar al reconectar.</text></g><!--link Familia to RA--><g class="link" data-entity-1="Familia" data-entity-2="RA" data-source-line="10" data-uid="lnk5" id="link_Familia_RA"><path d="M57.05,192.5 C77.81,192.5 102.72,192.5 131.67,192.5" fill="none" id="Familia-to-RA" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="137.67,192.5,128.67,188.5,132.67,192.5,128.67,196.5,137.67,192.5" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[rLJDRjD04BxxAKQvj8sQGDCMK2iXcSH1aKBZfYdNQh2dOQlrhjbTemh4bJD2uW4uSk340OaZUPC-2REsysCH9AwDBCNQ-Vb-PjOxSFVbqxrxWXtefvUTXuS0Kq8ftg41J9nuAr9CENWlDGMIhXqu3KRCNpj8XI6Mf5N0ohI18MP22Wm2VungBWbQjGc_VswneGNl0u3TlmDxW1Qc8GVhbj3fFFK77u90QKSrlhwkajhjiCJFZL29o56UjDihCZuSCo6jKf4mLx8SvLE0-A0BOuJh6eAiMtm5B1mf9n9CiLjbzReGtGhBg8L22AsOA_IDmYLR8EMBCTKGHsU3KNGsYq13T7OLJoVFfz75f6paVpaQ1fBydmY68TQf4y6LtQ0aEfJ5ZMxeA4kRH2r9IZm318bhqpoDi3yRlHmDmi5L-6mKJMTXfQ7NgCyBQH5Q8yL-e6bLAOUiKeBrEZE4n12MSY_8Cj26maZr2sDrLNJKACeApc5zKbkW6pA9zzjo6ms-MLrptE1YoEOy6G9l-Bhgr9kqx6jeBih6tZJZj7r0ncYkh1e-wa8eLusChrpyaavaUjrlVxDVXYOfhQl59PfJXqALMxWS- -E6D3QvACFby8oUCvm6fYstRmH2V_8Y7aUpS52FuCbsgtWQg1nAVk55kHnpmUHgDS