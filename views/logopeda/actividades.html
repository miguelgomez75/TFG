<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAA — Actividades</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#1a1f2e;--muted:#6b7280;--accent:#3b5bdb;--light:#eef1ff;--surface:#f8f9ff;--border:#e5e7f0;--red:#dc2626}
    body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink)}
    header{background:var(--ink);color:#fff;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-family:'DM Serif Display',serif;font-size:1.1rem}
    .btn-back{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.85rem}
    .container{max-width:1000px;margin:36px auto;padding:0 24px}
    h1{font-family:'DM Serif Display',serif;font-size:1.5rem;margin-bottom:6px}
    .subtitle{color:var(--muted);margin-bottom:28px;font-size:.9rem}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
    .btn-primary{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;font-size:.9rem}
    .btn-primary:hover{opacity:.9}
    .filters{display:flex;gap:10px}
    .filters select{padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:.85rem;background:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px}
    .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
    .card h3{font-size:.95rem;font-weight:700;flex:1}
    .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap}
    .badge.BORRADOR  {background:#fef3c7;color:#92400e}
    .badge.DISPONIBLE{background:#d1fae5;color:#065f46}
    .badge.ARCHIVADA {background:#f3f4f6;color:#6b7280}
    .card p{font-size:.83rem;color:var(--muted);margin-bottom:14px;line-height:1.4}
    .card-actions{display:flex;gap:6px;flex-wrap:wrap}
    .btn-sm{padding:5px 12px;border-radius:6px;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff}
    .btn-sm.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn-sm.danger{border-color:var(--red);color:var(--red)}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
    .overlay.open{display:flex}
    .modal{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
    .modal h2{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:24px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
    .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:var(--surface)}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
    .field textarea{min-height:60px;resize:vertical}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
    .btn-cancel{background:none;border:1.5px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:7px;font-family:inherit;cursor:pointer}
    #empty{color:var(--muted);font-style:italic;margin-top:20px}
  </style>
</head>
<body>
  <header>
    <span class="logo">CAA · Actividades</span>
    <button class="btn-back" onclick="window.location.href='/logopeda/dashboard.html'">← Volver</button>
  </header>
  <div class="container">
    <h1>Gestión de actividades</h1>
    <p class="subtitle">Crea, publica, archiva y asigna actividades CAA a tus pacientes.</p>
    <div class="toolbar">
      <div class="filters">
        <select id="filtroEstado" onchange="renderCards()">
          <option value="">Todos los estados</option>
          <option value="BORRADOR">Borrador</option>
          <option value="DISPONIBLE">Disponible</option>
          <option value="ARCHIVADA">Archivada</option>
        </select>
      </div>
      <button class="btn-primary" onclick="abrirNueva()">+ Nueva actividad</button>
    </div>
    <div class="grid" id="grid"><p id="empty">Cargando…</p></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Nueva actividad</h2>
      <input type="hidden" id="actId">
      <div class="field"><label>Título</label><input id="titulo" placeholder="Nombre de la actividad"></div>
      <div class="field"><label>Descripción</label><textarea id="descripcion" placeholder="Descripción breve…"></textarea></div>
      <div class="field"><label>Tipo</label>
        <select id="tipo">
          <option value="PICTOGRAMA">Pictograma</option>
          <option value="AUDIO">Audio</option>
          <option value="TEXTO">Texto</option>
          <option value="VIDEO">Vídeo</option>
        </select>
      </div>
      <div class="field"><label>Categoría</label><select id="categoriaId"><option value="">— Sin categoría —</option></select></div>
      <div class="field"><label>Nivel de dificultad (1–5)</label>
        <input type="number" id="nivelDificultad" min="1" max="5" value="1">
      </div>
      <div class="field"><label>Contenido (JSON)</label>
        <textarea id="contenido" placeholder='{"urlImagen":"…","etiqueta":"…"}'></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="cerrar()">Cancelar</button>
        <button class="btn-primary" onclick="guardar()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/compartida/login.html';
    let actividades = [];

    async function api(url,opts={}) {
      const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},...opts});
      return r.json();
    }

    async function cargar() {
      // RUP: listarActividades + listarCategorias en paralelo
      const [acts, cats] = await Promise.all([
        api('/api/logopeda/actividades'),
        api('/api/logopeda/categorias')
      ]);
      actividades = acts;
      const sel = document.getElementById('categoriaId');
      cats.forEach(c => {
        const o = document.createElement('option');
        o.value=c._id; o.textContent=c.nombre; sel.appendChild(o);
      });
      renderCards();
    }

    function renderCards() {
      const filtro = document.getElementById('filtroEstado').value;
      const lista  = filtro ? actividades.filter(a=>a.estado===filtro) : actividades;
      const grid   = document.getElementById('grid');
      if (!lista.length) { grid.innerHTML='<p id="empty">No hay actividades.</p>'; return; }
      grid.innerHTML = lista.map(a => `
        <div class="card">
          <div class="card-header">
            <h3>${a.titulo}</h3>
            <span class="badge ${a.estado}">${a.estado}</span>
          </div>
          <p>${a.descripcion||'Sin descripción'}</p>
          <div class="card-actions">
            <button class="btn-sm" onclick="abrirEditar('${a._id}')">Editar</button>
            ${a.estado==='BORRADOR' ?
              `<button class="btn-sm primary" onclick="publicar('${a._id}')">Publicar</button>` : ''}
            ${a.estado==='DISPONIBLE' ?
              `<button class="btn-sm" onclick="archivar('${a._id}')">Archivar</button>` : ''}
            <button class="btn-sm danger" onclick="eliminar('${a._id}')">Eliminar</button>
          </div>
        </div>`).join('');
    }

    function abrirNueva() {
      document.getElementById('actId').value='';
      document.getElementById('modalTitle').textContent='Nueva actividad';
      ['titulo','descripcion','contenido'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('tipo').value='PICTOGRAMA';
      document.getElementById('nivelDificultad').value=1;
      document.getElementById('overlay').classList.add('open');
    }

    async function abrirEditar(id) {
      const {actividad} = await api(`/api/logopeda/actividades/${id}`);
      document.getElementById('actId').value=id;
      document.getElementById('modalTitle').textContent='Editar actividad';
      document.getElementById('titulo').value=actividad.titulo;
      document.getElementById('descripcion').value=actividad.descripcion||'';
      document.getElementById('tipo').value=actividad.tipo;
      document.getElementById('nivelDificultad').value=actividad.nivelDificultad||1;
      document.getElementById('categoriaId').value=actividad.categoriaId?._id||actividad.categoriaId||'';
      document.getElementById('contenido').value=actividad.contenido?JSON.stringify(actividad.contenido,null,2):'';
      document.getElementById('overlay').classList.add('open');
    }

    function cerrar() { document.getElementById('overlay').classList.remove('open'); }

    async function guardar() {
      const id=document.getElementById('actId').value;
      let contenido;
      try { contenido=JSON.parse(document.getElementById('contenido').value||'{}'); } catch { contenido={}; }
      const body={
        titulo:document.getElementById('titulo').value,
        descripcion:document.getElementById('descripcion').value,
        tipo:document.getElementById('tipo').value,
        nivelDificultad:+document.getElementById('nivelDificultad').value,
        categoriaId:document.getElementById('categoriaId').value||undefined,
        contenido
      };
      if(id) await api(`/api/logopeda/actividades/${id}`,{method:'PUT',body:JSON.stringify(body)});
      else   await api('/api/logopeda/actividades',{method:'POST',body:JSON.stringify(body)});
      cerrar(); cargar();
    }

    async function publicar(id) {
      const r=await api(`/api/logopeda/actividades/${id}/publicar`,{method:'PUT'});
      if(r.error) alert(r.error); else cargar();
    }
    async function archivar(id) { await api(`/api/logopeda/actividades/${id}/archivar`,{method:'PUT'}); cargar(); }
    async function eliminar(id) {
      if(!confirm('¿Eliminar esta actividad?')) return;
      await api(`/api/logopeda/actividades/${id}`,{method:'DELETE'}); cargar();
    }

    cargar();
  </script>
</body>
</html>
