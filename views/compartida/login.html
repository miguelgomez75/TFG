<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAA — Acceso</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:    #1a1f2e;
      --muted:  #6b7280;
      --accent: #3b5bdb;
      --surface:#f8f9ff;
      --border: #e5e7f0;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 4px 32px rgba(59,91,219,.08);
    }
    .brand { font-family: 'DM Serif Display', serif; font-size: 1.75rem; color: var(--ink); margin-bottom: 4px; }
    .sub   { color: var(--muted); font-size: .9rem; margin-bottom: 36px; }
    label  { display: block; font-weight: 500; font-size: .85rem; color: var(--ink); margin-bottom: 6px; }
    input  {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: .95rem; color: var(--ink);
      margin-bottom: 20px; transition: border-color .2s;
      background: var(--surface);
    }
    input:focus { outline: none; border-color: var(--accent); background: #fff; }
    button {
      width: 100%; padding: 13px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: opacity .2s;
    }
    button:hover { opacity: .9; }
    .error { color: #dc2626; font-size: .85rem; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Sistema CAA</div>
    <p class="sub">Comunicación Aumentativa y Alternativa</p>
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="correo@ejemplo.com">
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">
    <button onclick="login()">Entrar</button>
    <div class="error" id="error">Credenciales incorrectas. Comprueba tus datos.</div>
  </div>
  <script>
    async function login() {
      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { document.getElementById('error').style.display = 'block'; return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('rol', data.rol);
      localStorage.setItem('nombre', data.nombre);
      window.location.href = data.rol === 'LOGOPEDA'
        ? '/logopeda/dashboard.html'
        : '/familia/dashboard.html';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
