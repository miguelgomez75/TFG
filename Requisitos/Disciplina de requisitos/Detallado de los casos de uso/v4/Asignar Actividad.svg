 font-size="11" lengthAdjust="spacing" textLength="56.3159" x="169.8167" y="383.1821">disponible</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="42.3726" x="424.7737" y="383.1821">cancela</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="260.4219" x="21" y="417.7764"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.4219" x="31" y="438.915">introduce confirmación de la asignación</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="673.5576"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="229.3848" x="734.0049" y="183.9326"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.3848" x="744.0049" y="205.0713">presenta lista de pacientes activos</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.1777" x="744.0049" y="219.04">• Nombre de cada paciente</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.8281" x="710.2832" y="305.8389"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.8281" x="720.2832" y="326.9775">presenta lista de actividades DISPONIBLES</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.3828" x="720.2832" y="340.9463">• Título y nivel de dificultad</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="362.123" x="493.3936" y="485.7139"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="342.123" x="503.3936" y="506.8525">permite crear AsignacionActividad en estado PENDIENTE</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.4219" x="503.3936" y="520.8213">• Vincula paciente ↔ actividad</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.8672" x="503.3936" y="534.79">• Notifica a la familia</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="331.7539" x="508.5781" y="581.5889"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.7539" x="518.5781" y="602.7275">retorna a PACIENTE_ABIERTO / ACTIVIDAD_ABIERTA</text><ellipse cx="674.4551" cy="646.5576" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="674.4551" cy="646.5576" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="294.8457" x="875.5166" y="417.7764"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.0195" x="885.5166" y="438.915">descarta la operación</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.8457" x="885.5166" y="452.8838">• No se crea ninguna Asignación de Actividad</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.6289" x="935.625" y="499.6826"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.6289" x="945.625" y="520.8213">retorna al estado anterior</text><ellipse cx="1022.9395" cy="578.6201" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1022.9395" cy="578.6201" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="487.3936" x2="487.3936" y1="50.042" y2="673.5576"/><line style="stroke:#000000;stroke-width:1.5;" x1="1174.3623" x2="1174.3623"