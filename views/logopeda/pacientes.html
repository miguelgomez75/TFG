<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAA — Pacientes</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#1a1f2e;--muted:#6b7280;--accent:#3b5bdb;--light:#eef1ff;--surface:#f8f9ff;--border:#e5e7f0;--red:#dc2626}
    body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink)}
    header{background:var(--ink);color:#fff;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-family:'DM Serif Display',serif;font-size:1.1rem}
    .btn-back{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.85rem}
    .container{max-width:900px;margin:36px auto;padding:0 24px}
    h1{font-family:'DM Serif Display',serif;font-size:1.5rem;margin-bottom:6px}
    .subtitle{color:var(--muted);margin-bottom:28px;font-size:.9rem}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .btn-primary{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;font-size:.9rem}
    .btn-primary:hover{opacity:.9}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
    th{background:var(--surface);padding:12px 16px;text-align:left;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border)}
    td{padding:12px 16px;font-size:.9rem;border-bottom:1px solid var(--border)}
    tr:last-child td{border-bottom:none}
    .badge-activo{background:#d1fae5;color:#065f46;padding:2px 9px;border-radius:20px;font-size:.75rem;font-weight:700}
    .badge-inactivo{background:#f3f4f6;color:#6b7280;padding:2px 9px;border-radius:20px;font-size:.75rem;font-weight:700}
    .btn-sm{padding:5px 12px;border-radius:6px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;margin-left:6px}
    .btn-sm.danger{border-color:var(--red);color:var(--red)}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
    .overlay.open{display:flex}
    .modal{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:460px}
    .modal h2{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:24px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
    .field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:var(--surface)}
    .field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
    .btn-cancel{background:none;border:1.5px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:7px;font-family:inherit;cursor:pointer}
  </style>
</head>
<body>
  <header>
    <span class="logo">CAA · Pacientes</span>
    <button class="btn-back" onclick="window.location.href='/logopeda/dashboard.html'">← Volver</button>
  </header>
  <div class="container">
    <h1>Gestión de pacientes</h1>
    <p class="subtitle">Crea y administra los pacientes asignados a tu consulta.</p>
    <div class="toolbar">
      <span id="countLabel" style="font-size:.85rem;color:var(--muted)"></span>
      <button class="btn-primary" onclick="abrirNuevo()">+ Nuevo paciente</button>
    </div>
    <table>
      <thead><tr><th>Nombre</th><th>Fecha nacimiento</th><th>Nivel</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Nuevo paciente</h2>
      <input type="hidden" id="pacienteId">
      <div class="field"><label>Nombre completo</label><input id="nombre" placeholder="Nombre del paciente"></div>
      <div class="field"><label>Fecha de nacimiento</label><input type="date" id="fechaNacimiento"></div>
      <div class="field"><label>Nivel actual</label>
        <select id="nivelActual">
          <option value="">— Sin asignar —</option>
          <option value="Inicial">Inicial</option>
          <option value="Básico">Básico</option>
          <option value="Intermedio">Intermedio</option>
          <option value="Avanzado">Avanzado</option>
        </select>
      </div>
      <div class="field"><label>Estado</label>
        <select id="activo"><option value="true">Activo</option><option value="false">Inactivo</option></select>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="cerrar()">Cancelar</button>
        <button class="btn-primary" onclick="guardar()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/compartida/login.html';

    async function api(url, opts={}) {
      const r = await fetch(url,{headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},...opts});
      return r.json();
    }

    async function cargar() {
      const ps = await api('/api/logopeda/pacientes');
      document.getElementById('countLabel').textContent = `${ps.length} paciente(s)`;
      document.getElementById('tbody').innerHTML = ps.map(p => `
        <tr>
          <td>${p.nombre}</td>
          <td>${p.fechaNacimiento ? new Date(p.fechaNacimiento).toLocaleDateString('es-ES') : '—'}</td>
          <td>${p.nivelActual || '—'}</td>
          <td><span class="${p.activo !== false ? 'badge-activo' : 'badge-inactivo'}">${p.activo !== false ? 'Activo' : 'Inactivo'}</span></td>
          <td>
            <button class="btn-sm" onclick="abrirEditar('${p._id}','${p.nombre}','${p.fechaNacimiento ? p.fechaNacimiento.split('T')[0] : ''}','${p.nivelActual||''}','${p.activo}')">Editar</button>
            <button class="btn-sm danger" onclick="eliminar('${p._id}')">Eliminar</button>
          </td>
        </tr>`).join('');
    }

    function abrirNuevo() {
      document.getElementById('pacienteId').value='';
      document.getElementById('modalTitle').textContent='Nuevo paciente';
      ['nombre','fechaNacimiento','nivelActual'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('activo').value='true';
      document.getElementById('overlay').classList.add('open');
    }

    function abrirEditar(id,nombre,fecha,nivel,activo) {
      document.getElementById('pacienteId').value=id;
      document.getElementById('modalTitle').textContent='Editar paciente';
      document.getElementById('nombre').value=nombre;
      document.getElementById('fechaNacimiento').value=fecha;
      document.getElementById('nivelActual').value=nivel;
      document.getElementById('activo').value=activo;
      document.getElementById('overlay').classList.add('open');
    }

    function cerrar() { document.getElementById('overlay').classList.remove('open'); }

    async function guardar() {
      const id=document.getElementById('pacienteId').value;
      const body={
        nombre:document.getElementById('nombre').value,
        fechaNacimiento:document.getElementById('fechaNacimiento').value||undefined,
        nivelActual:document.getElementById('nivelActual').value||undefined,
        activo:document.getElementById('activo').value==='true'
      };
      if(id) await api(`/api/logopeda/pacientes/${id}`,{method:'PUT',body:JSON.stringify(body)});
      else   await api('/api/logopeda/pacientes',{method:'POST',body:JSON.stringify(body)});
      cerrar(); cargar();
    }

    async function eliminar(id) {
      if(!confirm('¿Eliminar este paciente?')) return;
      await api(`/api/logopeda/pacientes/${id}`,{method:'DELETE'});
      cargar();
    }

    cargar();
  </script>
</body>
</html>
