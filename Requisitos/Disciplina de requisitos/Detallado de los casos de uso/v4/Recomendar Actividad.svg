tLength="45.0044" x="20" y="455.1196">Guardar</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="48.5278" x="124.5986" y="455.1196">Cancelar</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="707.5264"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="229.3848" x="970.6775" y="183.9326"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.3848" x="980.6775" y="205.0713">presenta lista de pacientes activos</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.1777" x="980.6775" y="219.04">• Nombre de cada paciente</text><polygon fill="#F1F1F1" points="1010.6956,305.8389,1160.0442,305.8389,1172.0442,317.8389,1160.0442,329.8389,1010.6956,329.8389,998.6956,317.8389,1010.6956,305.8389" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="149.3486" x="1010.6956" y="321.647">paciente con acceso activo</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="8.7871" x="989.9084" y="315.2446">sí</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="177.0527" x="1172.0442" y="315.2446">no — paciente sin acceso activo</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="333.4355" x="685.3906" y="349.8389"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.5508" x="695.3906" y="370.9775">presenta formulario de recomendación</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="313.4355" x="695.3906" y="384.9463">• Campo de instrucciones opcionales para la familia</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.2656" x="695.3906" y="398.915">• «Guardar» o «Cancelar»</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="385.4434" x="494.6323" y="489.7139"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="333.5918" x="504.6323" y="510.8525">permite crear RegistroClinico de tipo RECOMENDACION</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.1855" x="504.6323" y="524.8213">• Vinculado al paciente</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="365.4434" x="504.6323" y="538.79">• Actividad visible en sección «Recomendadas» de la familia</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="202.5723" x="586.0679" y="585.5889"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.5723" x="596.0679" y="606.7275">retorna a ACTIVIDAD_ABIERTA</text><ellipse cx="687.354" cy="664.5264" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="687.354" cy="664.5264" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="233.5742" x="900.0757" y="489.7139"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.0195" x="910.0757" y="510.8525">descarta la operación</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.5742" x="910.0757" y="524.8213">• No se crea ningún RegistroClinico</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="202.5723" x="915.5767" y="571.6201"/><text fill="#000000" font-family="sans-serif" font-s